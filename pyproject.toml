[project]
name = "discourse-pretix-luma"
version = "0.1.0"
description = "Ansible Community Events prototype"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.11",
    "isort>=6",
    "pyright>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B", "S", "T20", "DTZ", "UP", "SIM", "G"]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["T201"]
"scripts/create_event.py" = ["T201", "E501"]
"scripts/discourse-connect-mvp.py" = ["T201", "S105", "S310", "E501"]
"scripts/meetup_pro_lib.py" = ["S105"]
"scripts/meetup_list_organisers.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
